name: ligo_wallet

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Un job por unidad del workspace: la app y cada paquete se analizan,
# formatean y testean por separado (con su propio reporte de cobertura).
# Todos usan el workflow de Flutter, incluso los paquetes Dart puro: con pub
# workspaces, resolver un paquete resuelve todo el workspace, y la raíz
# depende del SDK de Flutter.
jobs:
  semantic-pull-request:
    if: github.event_name == 'pull_request'
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  app:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.50.x"
      run_bloc_lint: true
      min_coverage: 80
      # Los paquetes del workspace miden su cobertura en su propio job.
      coverage_excludes: "packages/**"

  wallet_domain:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.50.x"
      working_directory: packages/wallet_domain
      min_coverage: 80

  wallet_api:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.50.x"
      working_directory: packages/wallet_api
      min_coverage: 80
      coverage_excludes: "**/*.g.dart"

  wallet_storage:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.50.x"
      working_directory: packages/wallet_storage
      min_coverage: 80

  wallet_data:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.50.x"
      working_directory: packages/wallet_data
      min_coverage: 80

  wallet_l10n:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.50.x"
      working_directory: packages/wallet_l10n
      min_coverage: 80
      coverage_excludes: "lib/src/gen/**"

  wallet_ui:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.50.x"
      working_directory: packages/wallet_ui
      min_coverage: 80

  feature_auth:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.50.x"
      working_directory: packages/feature_auth
      min_coverage: 80
      run_bloc_lint: true

  feature_movements:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.50.x"
      working_directory: packages/feature_movements
      min_coverage: 80
      run_bloc_lint: true
